# =============================================================================
# CONFIGURAÇÃO DO STREAMLIT
# =============================================================================

[server]
headless = true
enableCORS = false

[browser]
gatherUsageStats = false

[theme]
primaryColor = "#2563eb"
backgroundColor = "#f0f2f6"
secondaryBackgroundColor = "#ffffff"
textColor = "#262730"
font = "sans serif"

[client]
# Timeout maior para uploads grandes
toolbarMode = "minimal"
showErrorDetails = false
